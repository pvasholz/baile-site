# Baile Research Institute — Netlify config
# The site is plain static files; there is no build step.
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Font files never change in place; a new version gets a new file name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The corpus is versioned with the site, so it can be cached hard.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The People page was retired; its content now lives on About.
[[redirects]]
  from = "/people.html"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/people"
  to = "/about.html"
  status = 301
